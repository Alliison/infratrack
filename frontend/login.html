<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Impacto — Login</title>
  <!-- Easter egg: o mark de quatro setas nao aparece mais em pagina nenhuma
       (a logo virou o wordmark SVG). Sobrevive aqui, na aba do navegador. -->
  <link rel="icon" type="image/svg+xml" href="/assets/img/impacto-mark.svg">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="mobile">
  <div class="card">
    <img class="card-logo" src="/assets/img/impacto-logo.svg" alt="Impacto"
         onerror="this.onerror=null;this.src='/assets/img/impacto-mark.svg'">
    <h1>Liberar painel</h1>

    <!-- Celular que ja e' controle de uma conta: libera a TV nova nessa conta,
         sem senha. A TV usa a sessao do FullTrack que a conta ja tem. -->
    <div class="pair-box" id="pair" hidden>
      <p class="sub" id="pair-who" style="margin-bottom:12px"></p>
      <div class="field">
        <label for="pair-name">Nome desta TV (opcional)</label>
        <input id="pair-name" maxlength="60" placeholder="Ex.: TV da recepção">
      </div>
      <button class="primary" id="pair-btn" type="button">Liberar sem senha</button>
      <p class="hint" style="margin-top:12px">
        <button class="linkbtn" id="pair-other" type="button">Entrar com outra conta FullTrack</button>
      </p>
    </div>

    <form id="form">
      <p class="sub">Entre com sua conta <b>FullTrack</b> para liberar a TV.</p>
      <div class="field">
        <label for="login">Usuário</label>
        <input id="login" name="login" autocomplete="username" autocapitalize="none" required>
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="primary" id="submit" type="submit">Entrar</button>
    </form>

    <div class="msg" id="msg"></div>
    <p id="after" hidden style="margin-top:16px">
      <a class="btn" href="/devices" style="color:var(--accent)">Gerenciar TVs →</a>
    </p>
  </div>
  <script src="/assets/js/session.js"></script>
  <script src="/assets/js/login.js"></script>
</body>
</html>
