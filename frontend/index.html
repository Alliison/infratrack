<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Impacto — Mosaico</title>
  <!-- Easter egg: o mark de quatro setas nao aparece mais em pagina nenhuma
       (a logo virou o wordmark SVG). Sobrevive aqui, na aba do navegador. -->
  <link rel="icon" type="image/svg+xml" href="/assets/img/impacto-mark.svg">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <div id="topbar">
    <span class="brand-lockup">
      <img class="brand-logo" src="/assets/img/impacto-logo.svg" alt="Impacto"
           onerror="this.onerror=null;this.src='/assets/img/impacto-mark.svg'">
    </span>
    <span class="stat"><b id="count">0</b> ligados</span>
    <span class="stat">grid <b id="grid">–</b></span>
    <span class="stat" id="page"></span>
    <span class="sep"></span>
    <span class="stat" id="clock">–</span>
    <span class="stat" id="updated">–</span>
    <a class="btn" href="#" id="cfgbtn">Configurar</a>
  </div>

  <div id="mosaic"></div>

  <div id="auth">
    <img class="logo-lg" src="/assets/img/impacto-logo.svg" alt="Impacto"
         onerror="this.onerror=null;this.src='/assets/img/impacto-mark.svg'">
    <p>Escaneie o QR-code com o celular para liberar o painel com sua conta FullTrack.</p>
    <div class="qrbox"><img id="qrimg" alt="QR-code de login"></div>
    <p class="hint" id="authhint">Aguardando leitura…</p>
  </div>

  <div id="cfg">
    <h1>Configurar mosaico</h1>
    <p>Escaneie o QR-code para escolher os veículos e preferências pelo celular.</p>
    <div class="qrbox"><img id="cfgqr" alt="QR-code de configuração"></div>
    <p class="hint">As mudanças salvas aparecem aqui automaticamente.</p>
    <a class="btn" href="#" id="cfgclose">Fechar</a>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/assets/js/mosaic.js"></script>
</body>
</html>
