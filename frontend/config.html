<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Impacto — Configurar mosaico</title>
  <!-- Easter egg: o mark de quatro setas nao aparece mais em pagina nenhuma
       (a logo virou o wordmark SVG). Sobrevive aqui, na aba do navegador. -->
  <link rel="icon" type="image/svg+xml" href="/assets/img/impacto-mark.svg">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="mobile">
  <div class="card">
    <img class="card-logo" src="/assets/img/impacto-logo.svg" alt="Impacto"
         onerror="this.onerror=null;this.src='/assets/img/impacto-mark.svg'">
    <h1>Mosaico salvo</h1>
    <p class="sub">Escolha os veículos e as preferências. Deixe tudo desmarcado para exibir <b>todos</b> os carros ligados.</p>

    <div class="row2">
      <div class="field">
        <label for="zoom">Zoom</label>
        <input id="zoom" type="number" min="3" max="19" value="15">
      </div>
      <div class="field">
        <label for="refresh">Atualizar (s)</label>
        <input id="refresh" type="number" min="3" max="60" value="6">
      </div>
    </div>
    <div class="field">
      <label class="check"><input type="checkbox" id="only_ligados" checked> No mosaico, exibir só carros ligados</label>
    </div>

    <div class="field">
      <label>Veículos <span id="selcount" class="sub"></span></label>
      <input id="filter" placeholder="Filtrar por placa ou modelo…" autocapitalize="none" style="margin-bottom:8px">
      <label class="check" style="margin-bottom:8px">
        <input type="checkbox" id="listOnlyLigados"> Mostrar só ligados na lista
      </label>
      <div class="veh-list" id="list">Carregando…</div>
    </div>

    <button class="secondary" id="clear" type="button">Limpar selecionados</button>
    <button class="primary" id="save">Continuar</button>
    <div class="msg" id="msg"></div>
    <p class="sub" style="margin-top:16px"><a href="/" style="color:var(--accent)">← Voltar ao mosaico</a></p>
  </div>

  <!-- Confirmacao: abre depois de escolher os veiculos e e' onde se decide o
       layout. "Seguir automatico" sai daqui sem impor nada — salva so' a
       selecao e devolve grade/sequencia para o automatico de sempre. -->
  <div class="modal" id="confirm">
    <div class="modal-box">
      <h2>Confirmar mosaico</h2>
      <p class="sub" id="cf-resumo"></p>

      <div class="field">
        <label>Grade</label>
        <div class="choice" id="cf-grid">
          <button type="button" data-grid="auto" class="on">Automática</button>
          <button type="button" data-grid="2x2">2×2</button>
          <button type="button" data-grid="2x3">2×3</button>
        </div>
      </div>

      <div class="field">
        <label class="check"><input type="checkbox" id="cf-rotativo"> Rodízio de páginas</label>
      </div>
      <div class="row2">
        <div class="field">
          <label for="cf-rotate">Trocar a cada (s)</label>
          <input id="cf-rotate" type="number" min="3" max="120" value="15">
        </div>
        <div class="field">
          <label for="cf-page-size">Telas por página</label>
          <input id="cf-page-size" type="number" min="1" max="16" value="9">
        </div>
      </div>

      <div class="field">
        <label>Sequência <span class="sub">na ordem em que você marcou</span></label>
        <div class="seq" id="cf-seq"></div>
      </div>

      <div class="msg" id="cf-aviso"></div>

      <button class="primary" id="cf-apply">Aplicar esta configuração</button>
      <button class="secondary" id="cf-auto">Seguir automático</button>
      <button class="secondary" id="cf-cancel" type="button">Voltar</button>
    </div>
  </div>

  <script src="/assets/js/config.js"></script>
</body>
</html>
